    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Immediate Inline Security Route Guard -->
    <script>
      (function() {
        try {
          var sessionStr = localStorage.getItem('wm_auth_session');
          var token = localStorage.getItem('wm_auth_token');
          var hash = (window.location.hash || '').toLowerCase();
          var isProtected = hash === '#admin' || hash === '#topics' || hash === '#leaderboard' || hash === '#exam';
          
          if (!sessionStr || !token) {
            if (isProtected) {
              window.location.hash = '#login';
            }
          } else {
            var session = JSON.parse(sessionStr);
            if (!session || !session.expiresAt || Date.now() > session.expiresAt) {
              localStorage.removeItem('wm_auth_session');
              localStorage.removeItem('wm_auth_token');
              localStorage.removeItem('wm_user');
              if (isProtected) {
                window.location.hash = '#login';
              }
            } else if (hash === '#admin' && session.user && session.user.role !== 'admin') {
              window.location.hash = '#topics';
            }
          }
        } catch (e) {
          window.location.hash = '#login';
        }
      })();
    </script>
  </head>
